<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoS Site — Exam Practice Studio</title>
  <meta name="description" content="Focused practice sessions for CFA, CMA, CPA, and FRM. Track your progress, review explanations, and master every section.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="public.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2318231d'/%3E%3Cpath d='M32 12l5 15 15 5-15 5-5 15-5-15-15-5 15-5 5-15z' fill='%23f4efe3'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23ef6a45'/%3E%3C/svg%3E">
</head>
<body>

    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 2.5l2.35 7.15L21.5 12l-7.15 2.35L12 21.5l-2.35-7.15L2.5 12l7.15-2.35L12 2.5z"/><circle cx="12" cy="12" r="2.1"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.4L12 3l8 7.4V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.6z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17.5H6.5A2.5 2.5 0 0 0 4 22V4.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M8 6h8M8 10h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4.4 0 7-3 7-6.5 0-3.2-2-5.3-3.7-7.2C13.7 6.6 12.5 4.3 12.5 2c-2.3 2.4-3.4 4.8-3.4 7 0 1.4.4 2.4.9 3.2-.8-.2-1.7-.9-2.2-1.7-.8 1.2-1.3 2.7-1.3 4.3C6.5 18.6 8.5 22 12 22z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/><path d="M5 14l.7 1.8L7.5 16.5l-1.8.7L5 19l-.7-1.8-1.8-.7 1.8-.7L5 14z"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6.2c0 5-3.4 8.6-8 9.8-4.6-1.2-8-4.8-8-9.8V5.5l8-3z"/><path d="M8.5 12l2.3 2.3 4.7-5"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M9 17h6v4H9v-4z"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 1 0-2 5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="i-lightbulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M8.2 14.5a7 7 0 1 1 7.6 0c-.8.6-1.3 1.4-1.3 2.5H9.5c0-1.1-.5-1.9-1.3-2.5z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-4 3.3-6 8-6s7.3 2 8 6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5M14 8l4 4-4 4M18 12H9"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.5-5.8L21 9M21 4v5h-5M20 12a8 8 0 0 1-13.5 5.8L3 15M3 20v-5h5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></symbol>
    <symbol id="i-credit" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3z"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></symbol>
  </svg>

  <div class="app-shell">
    <div class="sidebar-scrim" id="sidebarScrim"></div>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home" aria-label="LoS Site home">
        <span class="brand-mark"><svg class="icon"><use href="#i-logo"></use></svg></span>
        <span class="brand-text"><strong>LoS Site</strong><small>exam studio</small></span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <p class="nav-label">Workspace</p>
        <a class="nav-link" data-nav="dashboard" href="#/dashboard">
          <svg class="icon"><use href="#i-home"></use></svg><span>Dashboard</span>
        </a>
        <a class="nav-link" data-nav="courses" href="#/courses">
          <svg class="icon"><use href="#i-book"></use></svg><span>Course library</span>
        </a>
        <a class="nav-link" data-nav="progress" href="#/progress">
          <svg class="icon"><use href="#i-chart"></use></svg><span>My progress</span>
        </a>
        <a class="nav-link" data-nav="subscribe" href="#/subscribe">
          <svg class="icon"><use href="#i-credit"></use></svg><span>Plans & access</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="streak-card">
        <span class="streak-icon"><svg class="icon"><use href="#i-flame"></use></svg></span>
        <div>
          <strong><span id="sidebarStreak">0</span> day streak</strong>
          <p>Answer one question today to keep it alive.</p>
        </div>
      </div>

      <div class="account-card">
        <div class="avatar avatar-sm" id="sidebarAvatar">AM</div>
        <div class="account-copy">
          <strong id="sidebarUserName">Alex Morgan</strong>
          <span id="sidebarUserRole">CFA Level I candidate</span>
        </div>
        <button class="account-signout" id="signOutButton" aria-label="Sign out" title="Sign out">
          <svg class="icon"><use href="#i-exit"></use></svg>
        </button>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open navigation">
            <svg class="icon"><use href="#i-menu"></use></svg>
          </button>
          <div class="topbar-heading">
            <span class="topbar-kicker">Study workspace</span>
            <strong id="topbarTitle">Dashboard</strong>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="search-wrap" id="searchWrap">
            <svg class="icon search-icon"><use href="#i-search"></use></svg>
            <input id="globalSearch" type="search" placeholder="Search topics, sections..." autocomplete="off" aria-label="Search practice sections">
            <kbd>/</kbd>
            <div class="search-results" id="searchResults" hidden></div>
          </div>
          <button class="btn btn-primary btn-sm quick-practice" id="quickPractice">
            <svg class="icon"><use href="#i-sparkles"></use></svg>
            <span>Quick practice</span>
          </button>
          <div class="avatar" id="topbarAvatar" aria-label="Alex Morgan">AM</div>
        </div>
      </header>

      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
